<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a Wish</title>
  <style>
    body {
      margin: 0; background: #000; color: #000;
      font-family: system-ui, sans-serif; display: flex;
      justify-content: center; align-items: center;
      height: 100vh; text-align: center; overflow: hidden;
    }

    /* Video Player (Full Screen) */
    .video-player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    .video-player.active { display: block; }
    
    /* Overlay Content Layer */
    .content-overlay {
      position: relative;
      z-index: 10;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Hand-shaped Skin Color Button Design */
    #start-btn {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 16px 36px 16px 28px;
      cursor: pointer;
      background-color: #f1c27d; /* Natural skin tone */
      border: 3px solid #e0ac69;
      color: #3d2314; /* Deep brown text for contrast */
      
      /* Organic hand/pointer badge shaping */
      border-radius: 40px 15px 40px 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #start-btn:active {
      transform: scale(0.95);
      background-color: #e0ac69;
    }

    /* Step 2 Blow Screen styling - Pure Black Text */
    .step2-title {
      color: #000000;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .candle { font-size: 6rem; margin: 15px 0; }

    #status {
      font-size: 1.2rem;
      color: #000000;
      font-weight: 700;
      margin-top: 10px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- VIDEOS LAYER -->
  <video id="video1" class="video-player active" autoplay loop muted playsinline src="video1.mp4?v=2"></video>
  <video id="video2" class="video-player" playsinline src="video2.mp4"></video>
  <video id="video3" class="video-player" playsinline src="video3.mp4"></video>

  <!-- OVERLAY CONTENT LAYER -->
  <div class="content-overlay">
    <!-- Step 1: Skin-tone Hand Button -->
    <div id="step-1" class="screen active">
      <button id="start-btn">
        <span>👆</span> touch here princess 🐧
      </button>
    </div>

    <!-- Step 2: Candle Blowing Screen (Black Text) -->
    <div id="step-2" class="screen">
      <h2 class="step2-title">Blow on your microphone! 🌬️</h2>
      <div class="candle">🎂</div>
      <p id="status">Listening for blow...</p>
    </div>
  </div>

  <script>
    if (window.location.hash) {
      window.location.href = window.location.pathname;
    }

    const startBtn = document.getElementById('start-btn');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const statusText = document.getElementById('status');

    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const video3 = document.getElementById('video3');

    // Step 1 Click -> Show Candle Screen & Unmute Video 1
    startBtn.addEventListener('click', () => {
      step1.classList.remove('active');
      step2.classList.add('active');
      
      video1.muted = false;
      startMicDetection();
    });

    // Step 2: Microphone Blow Detection
    async function startMicDetection() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 256;
        microphone.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function checkBlow() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let average = sum / dataArray.length;

          if (average > 45) {
            statusText.innerText = "Candle blown!";
            stream.getTracks().forEach(track => track.stop());
            
            setTimeout(() => {
              playVideoSequence();
            }, 500);
            return;
          }
          requestAnimationFrame(checkBlow);
        }

        checkBlow();
      } catch (err) {
        statusText.innerText = "Microphone access blocked. Click screen to proceed.";
        document.body.addEventListener('click', () => {
          playVideoSequence();
        }, { once: true });
      }
    }

    // Step 3 & 4: Video 2 -> Video 3
    function playVideoSequence() {
      step2.classList.remove('active');
      video1.classList.remove('active');
      video1.pause();

      video2.classList.add('active');
      video2.currentTime = 0;
      video2.play();

      video2.addEventListener('ended', () => {
        video2.classList.remove('active');
        video3.classList.add('active');
        video3.currentTime = 0;
        video3.play();
      });

      video3.addEventListener('ended', () => {
        video3.pause();
      });
    }
  </script>
</body>
</html>
