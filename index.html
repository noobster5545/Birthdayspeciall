<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a Wish</title>
  <style>
    body {
      margin: 0; background: #000; color: #000;
      font-family: system-ui, sans-serif; display: flex;
      justify-content: center; align-items: center;
      height: 100vh; text-align: center; overflow: hidden;
    }

    /* Full Screen Video Players */
    .video-player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      display: none;
      z-index: 1;
    }
    .video-player.active { display: block; }
    
    /* Overlay Content Layer */
    .content-overlay {
      position: relative;
      z-index: 10;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    /* Skin Tone Hand-shaped Button */
    #start-btn {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 16px 36px 16px 28px;
      cursor: pointer;
      background-color: #f1c27d;
      border: 3px solid #e0ac69;
      color: #3d2314;
      border-radius: 40px 15px 40px 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* Fallback Blow Button */
    #tap-blow-btn {
      display: none; /* Hidden by default */
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 12px 24px;
      cursor: pointer;
      background-color: #ff4081;
      border: none;
      border-radius: 25px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 64, 129, 0.4);
    }

    /* Black Text Styling */
    .step2-title {
      color: #000000;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .candle { font-size: 6rem; margin: 15px 0; }

    #status {
      font-size: 1.2rem;
      color: #000000;
      font-weight: 700;
      margin-top: 10px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- VIDEOS -->
  <video id="video1" class="video-player active" autoplay loop muted playsinline src="video1.mp4?v=2"></video>
  <video id="video2" class="video-player" playsinline src="video2.mp4"></video>
  <video id="video3" class="video-player" playsinline src="video3.mp4"></video>

  <!-- OVERLAY -->
  <div class="content-overlay">
    <!-- Step 1 -->
    <div id="step-1" class="screen active">
      <button id="start-btn">
        <span>👆</span> touch here princess 🐧
      </button>
    </div>

    <!-- Step 2 -->
    <div id="step-2" class="screen">
      <h2 class="step2-title">Blow on your microphone! 🌬️</h2>
      <div class="candle">🎂</div>
      <p id="status">Listening for blow...</p>
      
      <!-- Hidden until mic permission is denied -->
      <button id="tap-blow-btn">Tap here to blow 🌬️</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const tapBlowBtn = document.getElementById('tap-blow-btn');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const statusText = document.getElementById('status');

    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const video3 = document.getElementById('video3');

    startBtn.addEventListener('click', () => {
      step1.classList.remove('active');
      step2.classList.add('active');
      
      video1.muted = false;
      startMicDetection();
    });

    async function startMicDetection() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Permission GRANTED: Hide fallback button
        tapBlowBtn.style.display = 'none';

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 256;
        microphone.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function checkBlow() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let average = sum / dataArray.length;

          if (average > 45) {
            statusText.innerText = "Candle blown!";
            stream.getTracks().forEach(track => track.stop());
            
            setTimeout(() => {
              playVideoSequence();
            }, 500);
            return;
          }
          requestAnimationFrame(checkBlow);
        }

        checkBlow();

      } catch (err) {
        // Permission DENIED: Reveal the tap button
        statusText.innerText = "Microphone access blocked.";
        tapBlowBtn.style.display = 'inline-block';
      }
    }

    // Manual tap fallback trigger
    tapBlowBtn.addEventListener('click', () => {
      statusText.innerText = "Candle blown!";
      setTimeout(() => {
        playVideoSequence();
      }, 300);
    });

    function playVideoSequence() {
      step2.classList.remove('active');
      video1.classList.remove('active');
      video1.pause();

      video2.classList.add('active');
      video2.currentTime = 0;
      video2.play();

      video2.addEventListener('ended', () => {
        video2.classList.remove('active');
        video3.classList.add('active');
        video3.currentTime = 0;
        video3.play();
      });

      video3.addEventListener('ended', () => {
        video3.pause();
      });
    }
  </script>
</body>
</html>
